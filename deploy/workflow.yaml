# Daily sweep: both sources in parallel against one project, then close the run.
# RUN_ID is this execution's id, so every row of one sweep shares it.
# A failed job fails its branch and the execution; totals are in SQL and in the
# finish job's log line.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: us-west1
          - job: zombie-sweep
          - target: ${default(map.get(args, "project"), "comglitn")}
          - run_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - sources:
        parallel:
          for:
            value: mode
            in: ["zombiescan", "recommender"]
            steps:
              - run_source:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                    body:
                      overrides:
                        containerOverrides:
                          - env:
                              - {name: MODE, value: "${mode}"}
                              - {name: RUN_ID, value: "${run_id}"}
                              - {name: PROJECT_TO_SCAN, value: "${target}"}
    # The agent writes the briefing from the SQL tools. A failed briefing does
    # not fail the sweep: the run closes without one.
    - brief:
        try:
          call: http.post
          args:
            url: ${sys.get_env("AGENT_URL") + "/briefing"}
            auth: {type: OIDC, audience: '${sys.get_env("AGENT_URL")}'}
            body: {run_id: "${run_id}"}
            timeout: 300
          result: b
        except:
          as: err
          assign:
            - b: {body: {briefing: ""}}
    - finish:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - {name: MODE, value: finish}
                    - {name: BRIEFING, value: "${b.body.briefing}"}
                    - {name: RUN_ID, value: "${run_id}"}
                    - {name: PROJECT_TO_SCAN, value: "${target}"}
    - done:
        return: {run_id: "${run_id}"}
